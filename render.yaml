# Blueprint do Render — https://render.com/docs/blueprint-spec
# Para usar: no painel do Render -> "New" -> "Blueprint" -> selecione este repo.
#
# Persistência: este app usa o Supabase (Postgres) quando as variáveis
# SUPABASE_URL e SUPABASE_SERVICE_KEY estão definidas. Por isso o plano FREE
# do Render serve: os dados ficam no Supabase, não no disco efêmero do Render.
services:
  - type: web
    name: bolao-do-brasil
    runtime: node
    plan: free
    branch: claude/bolao-brasil-sqlite-64dxtj
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Defina estes dois no painel do Render (Environment) — são segredos,
      # por isso ficam com sync:false e NÃO no arquivo.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
