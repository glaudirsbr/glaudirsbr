# Blueprint do Render — https://render.com/docs/blueprint-spec
# Para usar: no painel do Render -> "New" -> "Blueprint" -> selecione este repo.
services:
  - type: web
    name: bolao-do-brasil
    runtime: node
    plan: free
    branch: claude/bolao-brasil-sqlite-64dxtj
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: DB_PATH
        value: /var/data/bolao.db

    # ----------------------------------------------------------------------
    # IMPORTANTE sobre persistência dos dados:
    #
    # No plano FREE o disco é efêmero: os palpites são apagados a cada
    # novo deploy ou reinício do serviço. Para o bolão de teste tudo bem,
    # mas se quiser que os palpites NÃO se percam, descomente o bloco
    # "disk" abaixo (exige um plano pago, ex.: "starter") — o caminho já
    # está apontado para /var/data via DB_PATH acima.
    # ----------------------------------------------------------------------
    # disk:
    #   name: bolao-data
    #   mountPath: /var/data
    #   sizeGB: 1
